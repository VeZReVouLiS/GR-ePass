get_receipt:
  fields:
    order_id:
      required: false
      example: "1234567890"
      selector:
        text:
    wait:
      default: false
      selector:
        boolean:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: gr_epass

send_link:
  fields:
    target:
      required: false
      selector:
        entity:
          domain: notify
    entry_id:
      required: false
      selector:
        config_entry:
          integration: gr_epass
